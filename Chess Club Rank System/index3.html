<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Club Rank System</title>
<link rel="stylesheet" href="style3.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="page-background"></div>

<main class="container">

<header class="site-header">
<div class="chess-icon">♟</div>
<div>
<h1>Chess Club</h1>
<p>Club Rank System</p>
</div>
</header>

<section class="leaderboard-card">

<div class="leaderboard-heading">
<div>
<h2>Leaderboard</h2>
<p id="playerCount">Loading players...</p>
</div>

<div class="header-buttons">
<button id="changeLeaderboardButton" class="secondary-button">Change Leaderboard</button>
<button id="backButton" class="secondary-button">Back to Main Website</button>
</div>
</div>

<div id="statusMessage" class="status-message hidden"></div>

<div id="leaderboard" class="leaderboard">
<div class="loading">
<div class="spinner"></div>
<span>Loading leaderboard...</span>
</div>
</div>

</section>

<section id="loginPanel" class="panel hidden">

<div class="panel-header">
<div>
<h2>Authorised Access</h2>
<p>Enter the administrator login details.</p>
</div>
</div>

<form id="loginForm">

<label for="adminEmail">Admin email</label>
<input id="adminEmail" type="email" autocomplete="username" required placeholder="Enter admin email">

<label for="adminPin">PIN</label>
<input id="adminPin" type="password" inputmode="numeric" autocomplete="current-password" required placeholder="Enter PIN">

<div class="form-buttons">
<button type="submit" class="primary-button">Enter Editing Mode</button>
<button type="button" id="cancelLoginButton" class="secondary-button">Cancel</button>
</div>

<p id="loginMessage" class="form-message"></p>

</form>

</section>

<section id="editingPanel" class="panel hidden">

<div class="panel-header editing-header">
<div>
<h2>Change Leaderboard</h2>
<p>Move, rename, add, or remove players.</p>
</div>

<button id="exitEditingButton" class="secondary-button">Exit Editing</button>
</div>

<div id="editingPlayers" class="editing-players"></div>

<div class="management-section">

<h3>Add Player</h3>

<form id="addPlayerForm" class="add-player-form">
<input id="newPlayerName" type="text" maxlength="50" required placeholder="Player name">
<button type="submit" class="primary-button">Add Player</button>
</form>

</div>

<div class="save-section">
<button id="saveChangesButton" class="save-button">Save Changes</button>
<p id="saveMessage" class="form-message"></p>
</div>

</section>

<footer>
<p>Chess Club Rank System</p>
</footer>

</main>

<script src="script3.js"></script>

<script>
document.getElementById('backButton').addEventListener('click', () => {
window.location.href = '../index.html';
});
</script>

</body>
</html>
